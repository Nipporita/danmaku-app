<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Danmaku Server Test</title>
    </head>
    <body>
        <h2>Danmaku Simulator Test</h2>
        <p>Connect to ws://localhost:8080</p>
        <p>Expected message format: <code>{type, text, color, size, position, sender, senderId, is_special, blocked}</code></p>
    </body>
    <script>
        const ws = new WebSocket("ws://localhost:8080");

        ws.onopen = () => {
            console.log("Connected to WebSocket server");
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const blockedTag = data.blocked ? ' [BLOCKED]' : '';
            console.log(`[${data.type}] ${data.sender}: ${data.text}${blockedTag}`, data);
        };

        ws.onclose = () => {
            console.log("Disconnected from WebSocket server");
        };

        ws.onerror = (error) => {
            console.error("WebSocket error:", error);
        };
    </script>
</html>
